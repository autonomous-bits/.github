<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Accent Glow under the Logo -->
    <radialGradient id="logo-glow" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" />
  <rect width="1200" height="320" fill="url(#logo-glow)" />

  <!-- Subtle Tech Grid Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280" />
    <path d="M 80,0 L 80,320 M 160,0 L 160,320 M 240,0 L 240,320 M 320,0 L 320,320 M 400,0 L 400,320 M 480,0 L 480,320 M 560,0 L 560,320 M 640,0 L 640,320 M 720,0 L 720,320 M 800,0 L 800,320 M 880,0 L 880,320 M 960,0 L 960,320 M 1040,0 L 1040,320 M 1120,0 L 1120,320" />
  </g>

  <!-- Diagonal Tech Lines/Accents -->
  <path d="M 0,0 L 320,320 M 1200,0 L 880,320" stroke="#0ea5e9" stroke-width="1.5" opacity="0.08" stroke-dasharray="10 15" />
  <circle cx="320" cy="320" r="3" fill="#0ea5e9" opacity="0.2" />
  <circle cx="880" cy="320" r="3" fill="#0ea5e9" opacity="0.2" />

  <!-- Logo Group (Left-aligned, vertically centered) -->
  <g transform="translate(90, 65)">
    <!-- Glow Effect for Blue Accent Node -->
    <circle cx="171" cy="126" r="54" fill="#0ea5e9" opacity="0.22" filter="blur(8px)" />
    
    <!-- Connections (Lines) -->
    <line x1="108" y1="108" x2="108" y2="36" stroke="#e1e1e3" stroke-width="13.5" stroke-linecap="round" />
    <line x1="108" y1="108" x2="36" y2="153" stroke="#e1e1e3" stroke-width="13.5" stroke-linecap="round" />
    <line x1="108" y1="108" x2="171" y2="126" stroke="#e1e1e3" stroke-width="13.5" stroke-linecap="round" />
    
    <!-- Central Node -->
    <circle cx="108" cy="108" r="25" fill="#e1e1e3" />
    
    <!-- Outer Nodes -->
    <circle cx="108" cy="36" r="20" fill="#e1e1e3" />
    <circle cx="36" cy="153" r="20" fill="#e1e1e3" />
    
    <!-- Sky Blue Accent Node -->
    <circle cx="171" cy="126" r="29" fill="#0ea5e9" />
    <circle cx="171" cy="126" r="20" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- Text / Typography Group -->
  <g transform="translate(340, 145)">
    <!-- Organization Name -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="68" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="-1.5">Autonomous Bits</text>
          
    <!-- Tagline -->
    <text y="54" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="22" 
          font-weight="400" 
          fill="#94a3b8" 
          letter-spacing="0.5">AI-driven software factories &amp; orchestrators</text>
  </g>
</svg>
